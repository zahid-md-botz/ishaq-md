<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ISHAQ-MD — Pair Device</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --g1:#0f0c29;--g2:#302b63;--g3:#24243e;
  --green:#25d366;--white:#fff;--muted:#aaa;
}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:16px;font-family:'Segoe UI',-apple-system,sans-serif;
  overflow-x:hidden;
  position:relative;
}

/* ══ FULLSCREEN BACKGROUND IMAGE ══ */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('https://files.catbox.moe/ooexin.png') no-repeat center center / cover;
  z-index: 0;
  filter: brightness(0.25) saturate(0.5);
}

body::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(8, 12, 25, 0.75);
  backdrop-filter: blur(2px);
  z-index: 1;
}

/* Animated bg particles */
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2;}
.particle{
  position:absolute;border-radius:50%;opacity:.08;
  animation:float linear infinite;
}
.particle:nth-child(1){width:300px;height:300px;background:var(--green);left:-100px;top:-100px;animation-duration:18s;}
.particle:nth-child(2){width:200px;height:200px;background:#764ba2;right:-60px;top:30%;animation-duration:22s;animation-delay:-5s;}
.particle:nth-child(3){width:150px;height:150px;background:#667eea;left:40%;bottom:-50px;animation-duration:16s;animation-delay:-8s;}
.particle:nth-child(4){width:100px;height:100px;background:var(--green);right:20%;top:10%;animation-duration:20s;animation-delay:-3s;}
@keyframes float{
  0%{transform:translate(0,0) rotate(0deg) scale(1);}
  33%{transform:translate(30px,-30px) rotate(120deg) scale(1.1);}
  66%{transform:translate(-20px,20px) rotate(240deg) scale(.9);}
  100%{transform:translate(0,0) rotate(360deg) scale(1);}
}

/* CARD */
.card{
  position:relative;z-index:3;
  width:100%;max-width:430px;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;padding:32px 28px;
  box-shadow:0 25px 80px rgba(0,0,0,.5);
  animation:cardIn .6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}

/* LOGO */
.logo-wrap{text-align:center;margin-bottom:24px;}
.logo-ring{
  width:88px;height:88px;margin:0 auto 14px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--green),#128c7e);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;color:white;
  box-shadow:0 0 0 0 rgba(37,211,102,.4);
  animation:pulse 2.5s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.4);}
  50%{box-shadow:0 0 0 20px rgba(37,211,102,0);}
}
.logo-title{font-size:28px;font-weight:800;color:white;letter-spacing:1px;}
.logo-sub{font-size:13px;color:var(--muted);margin-top:4px;}

/* SOCIALS */
.socials{display:flex;justify-content:center;gap:10px;margin:16px 0;}
.social-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:white;text-decoration:none;
  transition:transform .25s,box-shadow .25s;
  position:relative;overflow:hidden;
}
.social-btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.15);opacity:0;transition:opacity .2s;}
.social-btn:hover{transform:translateY(-3px) scale(1.1);box-shadow:0 8px 20px rgba(0,0,0,.4);}
.social-btn:hover::before{opacity:1;}
.yt{background:#ff0000;}.tg{background:#0088cc;}.wa{background:#25d366;}.gh{background:#333;}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;}
.divider span{flex:1;height:1px;background:rgba(255,255,255,.12);}
.divider p{font-size:12px;color:var(--muted);}

/* STEPS */
.steps{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:14px 16px;margin-bottom:20px;
}
.steps-title{font-size:12px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;}
.step-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.step-row:last-child{margin-bottom:0;}
.step-num{
  width:22px;height:22px;border-radius:50%;
  background:var(--green);color:white;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.step-txt{font-size:13px;color:rgba(255,255,255,.75);}

/* INPUT */
.input-wrap{position:relative;margin-bottom:14px;}
.input-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:16px;
}
.inp{
  width:100%;padding:14px 14px 14px 44px;
  background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:14px;font-size:15px;color:white;
  transition:border-color .25s,background .25s,box-shadow .25s;
}
.inp::placeholder{color:rgba(255,255,255,.35);}
.inp:focus{
  outline:none;
  border-color:var(--green);
  background:rgba(255,255,255,.1);
  box-shadow:0 0 0 4px rgba(37,211,102,.15);
}

/* BUTTON */
.btn-gen{
  width:100%;padding:15px;
  background:linear-gradient(135deg,var(--green),#128c7e);
  border:none;border-radius:14px;
  color:white;font-size:16px;font-weight:700;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .25s,box-shadow .25s;
  margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.btn-gen::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.2),transparent);
  opacity:0;transition:opacity .2s;
}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(37,211,102,.4);}
.btn-gen:hover::after{opacity:1;}
.btn-gen:active{transform:translateY(0);}
.btn-gen:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}

.btn-copy{
  width:100%;padding:12px;
  background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:14px;color:white;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .25s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-copy:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);}

/* CODE BOX */
.code-box{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);
  border-radius:14px;padding:16px;text-align:center;
  min-height:52px;display:flex;align-items:center;justify-content:center;
  margin-bottom:12px;font-size:15px;font-weight:600;
  transition:all .3s;word-break:break-all;
}
.code-box.has-code{
  border-color:var(--green);
  background:rgba(37,211,102,.1);
  box-shadow:0 0 20px rgba(37,211,102,.15);
}
.code-val{color:var(--green);font-size:22px;letter-spacing:3px;font-weight:800;}
.msg-success{color:var(--green);display:flex;align-items:center;gap:8px;}
.msg-error{color:#ff6b6b;display:flex;align-items:center;gap:8px;font-size:13px;}
.msg-default{color:rgba(255,255,255,.4);font-size:13px;}

/* SPINNER */
.spinner{display:none;text-align:center;padding:12px 0;}
.spinner i{font-size:24px;color:var(--green);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* FOOTER */
.footer{text-align:center;margin-top:20px;font-size:12px;color:rgba(255,255,255,.3);}

/* ══ ADMIN BUTTON (Sidebar Style) ══ */
.admin-fab{
  position:fixed;bottom:24px;right:24px;z-index:100;
  background:linear-gradient(135deg,#6c5ce7,#a855f7);
  color:white;padding:14px 22px;border-radius:30px;
  text-decoration:none;font-size:14px;font-weight:700;
  box-shadow:0 6px 24px rgba(108,92,231,.5);
  display:flex;align-items:center;gap:10px;
  transition:transform .25s,box-shadow .25s;
  animation:fabIn .6s .3s both;
  border:1px solid rgba(255,255,255,.1);
}
.admin-fab i{font-size:18px;}
@keyframes fabIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.admin-fab:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 12px 30px rgba(108,92,231,.6);
}
.admin-fab:active{transform:scale(.95);}

/* ══ ADMIN BUTTON (Top Right) ══ */
.admin-top{
  position:fixed;top:20px;right:20px;z-index:100;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:white;padding:10px 18px;border-radius:30px;
  text-decoration:none;font-size:13px;font-weight:600;
  border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;gap:8px;
  transition:all .25s;
  animation:fabIn .6s .5s both;
}
.admin-top:hover{
  background:rgba(255,255,255,.15);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.admin-top i{font-size:15px;color:#a855f7;}

/* ══ RESPONSIVE ══ */
@media(max-width:600px){
  .card{padding:24px 16px;}
  .logo-title{font-size:22px;}
  .admin-fab{bottom:16px;right:16px;padding:10px 16px;font-size:12px;}
  .admin-fab i{font-size:14px;}
  .admin-top{top:12px;right:12px;padding:6px 12px;font-size:11px;}
  .admin-top i{font-size:12px;}
}
</style>
</head>
<body>

<!-- ══ PARTICLES ══ -->
<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<!-- ══ ADMIN BUTTON (Top Right) ══ -->
<a href="/admin-panel" class="admin-top">
  <i class="fas fa-shield-alt"></i> ADMIN
</a>

<!-- ══ ADMIN BUTTON (Bottom Right FAB) ══ -->
<a href="/admin-panel" class="admin-fab">
  <i class="fas fa-shield-alt"></i> Admin Panel
</a>

<!-- ══ MAIN CARD ══ -->
<div class="card">
  <div class="logo-wrap">
    <div class="logo-ring"><i class="fab fa-whatsapp"></i></div>
    <div class="logo-title">ISHAQ-MD</div>
    <div class="logo-sub">WhatsApp Bot Linker v5.0</div>
    <div class="socials">
      <a class="social-btn yt" href="https://www.youtube.com/@ISHAQ-MD1" target="_blank"><i class="fab fa-youtube"></i></a>
      <a class="social-btn tg" href="https://t.me/+katala0077" target="_blank"><i class="fab fa-telegram-plane"></i></a>
      <a class="social-btn wa" href="https://whatsapp.com/channel/0029VbCXLYu2UPBKXPM5L03t" target="_blank"><i class="fab fa-whatsapp"></i></a>
      <a class="social-btn gh" href="https://github.com/ISHAQ" target="_blank"><i class="fab fa-github"></i></a>
    </div>
  </div>

  <div class="steps">
    <div class="steps-title">📱 How to link</div>
    <div class="step-row"><div class="step-num">1</div><div class="step-txt">Enter number with country code</div></div>
    <div class="step-row"><div class="step-num">2</div><div class="step-txt">Click Generate Pair Code</div></div>
    <div class="step-row"><div class="step-num">3</div><div class="step-txt">WhatsApp → Settings → Linked Devices</div></div>
    <div class="step-row"><div class="step-num">4</div><div class="step-txt">Tap Link a Device → Enter code</div></div>
  </div>

  <div class="input-wrap">
    <i class="fas fa-phone input-icon"></i>
    <input class="inp" id="num" type="tel" placeholder="+923307092214" autocomplete="tel"/>
  </div>

  <button class="btn-gen" id="genBtn" onclick="generate()">
    <i class="fas fa-key"></i> Generate Pair Code
  </button>

  <div class="spinner" id="spinner"><i class="fas fa-spinner"></i></div>

  <div class="code-box" id="codeBox">
    <span class="msg-default">Your pair code will appear here</span>
  </div>

  <button class="btn-copy" id="copyBtn" onclick="copyCode()">
    <i class="fas fa-copy"></i> Copy Code
  </button>

  <div class="footer">© 2026 ISHAQ-MD⁸⁷³ — All Rights Reserved</div>
</div>

<script>
let lastCode = '';

async function generate() {
  const raw = document.getElementById('num').value.trim();
  if (!raw) return showErr('Enter your WhatsApp number');
  const num = raw.replace(/[^0-9]/g, '');
  if (num.length < 10) return showErr('Include country code (e.g. +923...)');

  setLoad(true);
  try {
    const r = await fetch(`/pair?number=${num}`);
    const d = await r.json();
    if (d.success && d.code) {
      lastCode = d.code;
      showCode(d.code);
    } else {
      showErr(d.error || d.code || 'Generation failed. Try again.');
    }
  } catch(e) { showErr('Network error. Please retry.'); }
  setLoad(false);
}

function showCode(code) {
  const box = document.getElementById('codeBox');
  box.classList.add('has-code');
  box.innerHTML = `<div><div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:6px;">YOUR PAIR CODE</div><div class="code-val">${code}</div></div>`;
}

function showErr(msg) {
  const box = document.getElementById('codeBox');
  box.classList.remove('has-code');
  box.innerHTML = `<div class="msg-error"><i class="fas fa-exclamation-circle"></i>${msg}</div>`;
}

function setLoad(on) {
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('genBtn').disabled = on;
  if (on) {
    const box = document.getElementById('codeBox');
    box.classList.remove('has-code');
    box.innerHTML = '<div class="msg-default"><i class="fas fa-spinner fa-spin" style="color:#25d366;margin-right:8px;"></i>Generating...</div>';
  }
}

function copyCode() {
  if (!lastCode) return;
  navigator.clipboard.writeText(lastCode).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
    btn.style.borderColor = '#25d366';
    btn.style.color = '#25d366';
    setTimeout(() => {
      btn.innerHTML = '<i class="fas fa-copy"></i> Copy Code';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 2500);
  });
}

document.getElementById('num').addEventListener('keydown', e => { if(e.key === 'Enter') generate(); });
</script>
</body>
</html>
